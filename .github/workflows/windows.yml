name: Windows executable
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false
      - name: Resolve modules
        run: go mod tidy
      - name: Format Go sources
        run: gofmt -w .
      - name: Tests including Windows DPAPI
        run: go test -v ./...
      - name: Static checks
        run: go vet ./...
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Build Windows desktop app
        run: wails build -clean -platform windows/amd64 -webview2 download
      - uses: actions/upload-artifact@v4
        with:
          name: PrimerCRM-Go-Windows
          path: build/bin/PrimerCRM.exe
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Go-module-lock
          path: go.sum
