name: Windows executable
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests including Windows encryption
        run: python -m unittest -v
      - name: Install build tool
        run: python -m pip install pyinstaller==6.16.0
      - name: Build desktop executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PrimerCRM app.py
      - uses: actions/upload-artifact@v4
        with:
          name: PrimerCRM-Windows
          path: dist/PrimerCRM.exe
          retention-days: 30
